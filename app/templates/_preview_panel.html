{# Floating live-preview panel. Requires preview panel JS in the host page. #}
<div id="preview-panel" class="hidden md:block fixed z-40 w-fit min-w-[15rem] rounded-lg border border-base-content/20 bg-base-200 shadow-xl select-none" style="bottom: 5rem; right: 1.5rem;">
    <div id="preview-panel-header" class="flex items-center justify-between px-3 py-2 cursor-grab border-b border-base-content/15 rounded-t-lg">
        <span class="text-xs font-semibold uppercase tracking-wide text-base-content/40">Preview</span>
        <button id="preview-panel-toggle" class="btn btn-ghost btn-xs text-base-content/50 hover:text-base-content px-1 min-h-0 h-auto leading-none" title="Minimize">
            <svg id="preview-chevron" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"/>
            </svg>
        </button>
    </div>
    <div id="preview-panel-body" class="px-3 py-2 grid grid-cols-[auto_auto] gap-x-4 gap-y-1.5 text-sm">
        <span class="text-base-content/60 whitespace-nowrap">P&amp;I <span class="text-xs">/mo</span></span>
        <span id="preview_pi" class="font-mono font-medium tabular-nums text-right">—</span>

        <span class="text-base-content/60 whitespace-nowrap">Monthly total <span class="text-xs">/mo</span></span>
        <span id="preview_monthly" class="font-mono font-medium tabular-nums text-right">—</span>

        <span class="text-base-content/60 whitespace-nowrap">Due at closing</span>
        <span id="preview_closing" class="font-mono font-medium tabular-nums text-right">—</span>

        <span class="text-base-content/60 whitespace-nowrap">Paid after 1 yr</span>
        <span id="preview_1yr" class="font-mono font-medium tabular-nums text-right">—</span>

        <span class="text-base-content/60 whitespace-nowrap">Paid after 3 yrs</span>
        <span id="preview_3yr" class="font-mono font-medium tabular-nums text-right">—</span>

        <span class="text-base-content/60 whitespace-nowrap">Paid after 5 yrs</span>
        <span id="preview_5yr" class="font-mono font-medium tabular-nums text-right">—</span>
    </div>
</div>
