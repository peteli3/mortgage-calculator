<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mortgage Calculator{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='/favicon.ico') }}">
    <link href="{{ url_for('static', path='/output.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', path='/htmx.org@2.0.4/dist/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='/htmx-ext-json-enc@2.0.1/json-enc.js') }}"></script>
</head>
<body class="overflow-x-hidden">
    <div class="drawer">
        <input id="nav-drawer" type="checkbox" class="drawer-toggle" />
        <div class="drawer-content flex flex-col h-screen justify-between">
            <div class="navbar bg-base-200">
                <div class="container mx-auto px-4 flex items-center gap-2">
                    <!-- Hamburger: mobile only -->
                    <label for="nav-drawer" class="btn btn-ghost btn-sm md:hidden" aria-label="Open menu">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </label>
                    <h1 class="text-lg md:text-xl font-bold whitespace-nowrap flex-1">Mortgage Calculator</h1>
                    <!-- Inline nav: desktop only -->
                    <nav class="hidden md:flex items-center gap-1">
                        <a href="/"
                           class="px-3 py-1 rounded text-sm font-medium border {% if request.url.path == '/' %}border-base-content{% else %}border-transparent hover:border-base-content/40{% endif %}">
                            Home
                        </a>
                        <a href="/amortization"
                           class="px-3 py-1 rounded text-sm font-medium border {% if request.url.path.startswith('/amortization') %}border-base-content{% else %}border-transparent hover:border-base-content/40{% endif %}">
                            Amortization
                        </a>
                        <a href="/buy-vs-rent"
                           class="px-3 py-1 rounded text-sm font-medium border {% if request.url.path == '/buy-vs-rent' %}border-base-content{% else %}border-transparent hover:border-base-content/40{% endif %}">
                            Buy vs Rent
                        </a>
                    </nav>
                </div>
            </div>
            <main class="mb-auto">
                <div class="container mx-auto px-4">
                    {% block content %}{% endblock %}
                </div>
            </main>
            <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4">
                <aside class="flex gap-4 text-sm opacity-70">
                    <span>Version: {{ version }} ({{ git_commit }})</span>
                    <span class="opacity-40">|</span>
                    <span>Up since: <span id="restart-time" data-utc="{{ restart_time }}">{{ restart_time }}</span></span>
                </aside>
            </footer>
        </div><!-- drawer-content -->

    <!-- Mobile drawer side panel -->
    <div class="drawer-side z-50">
        <label for="nav-drawer" aria-label="Close menu" class="drawer-overlay"></label>
        <aside class="bg-base-200 min-h-full w-56 flex flex-col p-4 gap-1">
            <p class="text-xs font-semibold uppercase opacity-50 px-2 mb-2">Navigation</p>
            <a href="/"
               class="px-3 py-2 rounded text-sm font-medium border {% if request.url.path == '/' %}border-base-content bg-base-300{% else %}border-transparent hover:bg-base-300{% endif %}">
                Home
            </a>
            <a href="/amortization"
               class="px-3 py-2 rounded text-sm font-medium border {% if request.url.path.startswith('/amortization') %}border-base-content bg-base-300{% else %}border-transparent hover:bg-base-300{% endif %}">
                Amortization
            </a>
            <a href="/buy-vs-rent"
               class="px-3 py-2 rounded text-sm font-medium border {% if request.url.path == '/buy-vs-rent' %}border-base-content bg-base-300{% else %}border-transparent hover:bg-base-300{% endif %}">
                Buy vs Rent
            </a>
        </aside>
    </div>
</div><!-- drawer -->

    <dialog id="loginModal" class="modal">
        <div class="modal-box max-w-md text-left">
            <h3 class="font-bold text-lg mb-2" id="loginModalTitle">Login</h3>
            <p class="mb-2">
                <span id="logged-in-as">{{ logged_in_as }}</span>
            </p>
            <form id="loginForm" class="flex flex-col gap-3">
                <div class="flex flex-col gap-3 w-full mb-3">
                    <div class="flex items-center gap-3">
                        <label for="username" class="w-24">Username:</label>
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="Username"
                               required
                               class="input input-bordered w-full">
                    </div>
                    <div class="flex items-center gap-3">
                        <label for="password" class="w-24">Password:</label>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Password"
                               required
                               class="input input-bordered w-full">
                    </div>
                </div>
                <div class="flex flex-col items-center gap-3">
                    <div class="flex gap-3">
                        <button type="submit"
                                hx-post="/login"
                                hx-target="#logged-in-as"
                                hx-ext="json-enc"
                                hx-on::after-request="handleLoginResponse(event)"
                                class="btn btn-primary">Login</button>
                        <button type="button"
                                hx-post="/logout"
                                hx-target="#logged-in-as"
                                hx-ext="json-enc"
                                class="btn btn-error">Logout</button>
                    </div>
                </div>
            </form>
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="loginModal.close()">✕</button>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    {% block scripts %}{% endblock %}

    <script>
        function showLoginModal() {
            const loginModal = document.getElementById('loginModal');
            if (loginModal) {
                loginModal.showModal();
            }
        }

        function handleLoginResponse(event) {
            if (event.detail.successful) {
                const isHomePage = window.location.pathname === '/' || window.location.pathname === '';
                if (!isHomePage) {
                    const loginModal = document.getElementById('loginModal');
                    if (loginModal) {
                        loginModal.close();
                    }
                    location.reload();
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const restartEl = document.getElementById('restart-time');
            if (restartEl) {
                const utc = restartEl.dataset.utc;
                const d = new Date(utc);
                if (!isNaN(d)) {
                    restartEl.textContent = d.toLocaleString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric',
                        hour: '2-digit', minute: '2-digit', second: '2-digit',
                        timeZoneName: 'short'
                    });
                }
            }

            // Set login modal title based on current page
            const isHomePage = window.location.pathname === '/' || window.location.pathname === '';
            const loginModalTitle = document.getElementById('loginModalTitle');
            if (loginModalTitle && !isHomePage) {
                loginModalTitle.textContent = 'Login Required';
            }
            // Check if we should show the login modal based on URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('show_login')) {
                showLoginModal();
            }
        });
    </script>
</body>
</html>
