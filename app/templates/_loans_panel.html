{% macro loans_panel(tbody_id, empty_id) %}
    <div class="w-1/3 flex flex-col min-h-0">
        <div class="bg-base-200 rounded-t px-4 py-2 border-b border-base-300">
            <h2 class="text-xl font-bold tracking-wide">Loans</h2>
        </div>
        <div class="bg-base-200 rounded-b flex-1 overflow-y-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-base-300 text-xs text-base-content/50 uppercase tracking-wide">
                        <th class="pl-4 pr-3 py-2 text-left font-medium cursor-pointer select-none"
                            data-sort-key="name">Name</th>
                        <th class="hidden xl:table-cell px-3 py-2 text-right font-medium cursor-pointer select-none"
                            data-sort-key="loan_amount">Loan Amt</th>
                        <th class="hidden 2xl:table-cell px-3 py-2 text-right font-medium cursor-pointer select-none"
                            data-sort-key="pi">P&amp;I/mo</th>
                        <th class="pl-3 pr-4 py-2"></th>
                    </tr>
                </thead>
                <tbody id="{{ tbody_id }}">
                    <tr id="{{ empty_id }}">
                        <td colspan="4"
                            class="pl-4 pr-4 py-6 text-center text-base-content/40 text-xs">
                            No loans saved. Add loans on the <a href="{{ request.scope.root_path }}/" class="underline">Homepage</a>.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
{% endmacro %}
