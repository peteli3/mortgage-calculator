services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ROOT_PATH: /mortgage-calculator
      # Trust nginx's X-Forwarded-Proto so url_for() emits https:// links.
      # nginx connects from a Docker bridge IP, not 127.0.0.1, and the app
      # port is unpublished (only reachable via nginx), so trusting all is safe.
      FORWARDED_ALLOW_IPS: "*"
    networks:
      mortgage-net:
        aliases:
          - mortgage-app

networks:
  mortgage-net:
    external: true
